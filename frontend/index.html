<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       
       not written by hand in this file. -->
<body>

    <nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <span class="navbar-brand mb-0 h1">
            Expense Tracker
        </span>

        <button
            id="darkModeButton"
            class="btn btn-outline-light btn-sm"
            type="button"
        >
            Dark Mode
        </button>

    </div>
</nav>
    <main class="container my-4">
        <div id="alertContainer"></div>
        <div class="summarygrid mb-4">
    <div class="card summarycard">
        <div class="card-body">
            <h6>Total Amount</h6>
            <h3 id="totalAmount">0.00</h3>
        </div>
    </div>
    <div class="card summarycard">
        <div class="card-body">
            <h6>Number of Expenses</h6>
            <h3 id="expenseCount">0</h3>
        </div>
    </div>
    <div class="card summarycard">
        <div class="card-body">
            <h6>Highest Expense</h6>
            <h3 id="highestExpense">0.00</h3>
        </div>
    </div>
</div>
        <div class="card mb-4">

            <div class="card-body">

                <h4 class="mb-3">Add Expense</h4>

                <form id="expenseForm">

                    <div class="row g-3">

                        <div class="col-md-3">
                            <input
                                id="title"
                                type="text"
                                class="form-control"
                                placeholder="Title"
                                required
                            >
                        </div>
                        <div class="col-md-2">
                            <input
                                id="amount"
                                type="number"
                                step="0.01"
                                class="form-control"
                                placeholder="Amount"
                                required
                            >
                        </div>
                        <div class="col-md-3">
                            <select
                                id="category"
                                class="form-select"
                                required
                            >
                                <option value="">
                                    Select Category
                                </option>
                                <option value="Food">
                                    Food
                                </option>
                                <option value="Transport">
                                    Transport
                                </option>
                                <option value="Bills">
                                    Bills
                                </option>
                                <option value="Entertainment">
                                    Entertainment
                                </option>
                                <option value="Other">
                                    Other
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input
                                id="date"
                                type="date"
                                class="form-control"
                                required
                            >
                        </div>
                        <div class="col-md-2">
                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Add
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="mb-3">
            <select
                id="categoryFilter"
                class="form-select"
                style="max-width: 250px;"
            >
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">
                    Entertainment
                </option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div
            id="spinner"
            class="text-center my-4 d-none"
        >
            <div class="spinner-border"></div>
        </div>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="expenseTableBody">
                </tbody>
            </table>
        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
